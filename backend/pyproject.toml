[project]
name = "trivexa"
version = "0.1.0"
description = "Local image and 3D generation studio"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "torch>=2.8",
    "diffusers>=0.35",
    "transformers>=4.51",  # Qwen3 (SkinTokens)
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.30",
    "pillow>=11",
    "einops>=0.8.2",
    "timm>=1.0.30",
    "torchvision>=0.29.1",
    "omegaconf>=2.4.0",
    "trimesh>=5.1.1",
    "pymcubes>=0.1.6",
    "moderngl>=5.13.0",
    "xatlas>=0.0.11",
    "opencv-python-headless>=5.0.0.93",
    "pymeshlab>=2023.12",  # TripoSG face limit; also the texture baker
]

[project.optional-dependencies]
# MV-Adapter's texture baker (the default when installed; see settings.toml). nvdiffrast is compiled
# against the installed torch, so building it needs the CUDA toolkit (nvcc) and ninja.
texture = [
    "nvdiffrast",
    "open3d>=0.19",
    "spandrel>=0.4",
    "gltflib>=1.0",
    "cvcuda-cu13>=0.18",
]

[tool.uv]
no-build-isolation-package = ["nvdiffrast"]

[tool.uv.sources]
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast", tag = "v0.4.0" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
