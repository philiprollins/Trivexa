[project]
name = "trivexa"
version = "0.1.0"
description = "Local image and 3D generation studio"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "torch>=2.8",
    "diffusers>=0.35",
    "transformers>=4.51",  # Qwen3 (SkinTokens)
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.30",
    "pillow>=11",
    "einops>=0.8.2",
    "timm>=1.0.30",
    "torchvision>=0.29.1",
    "omegaconf>=2.4.0",
    "trimesh>=5.1.1",
    "pymcubes>=0.1.6",
    "moderngl>=5.13.0",
    "xatlas>=0.0.11",
    "opencv-python-headless>=5.0.0.93",
    "pymeshlab>=2023.12",  # TripoSG face limit; also the texture baker
    "scikit-learn>=1.6",
    "torchdiffeq>=0.2.5",
]

[project.optional-dependencies]
# MV-Adapter's texture baker (the default when installed; see settings.toml). nvdiffrast is compiled
# against the installed torch, so building it needs the CUDA toolkit (nvcc) and ninja.
texture = [
    "nvdiffrast",
    "open3d>=0.19",
    "spandrel>=0.4",
    "gltflib>=1.0",
    "cvcuda-cu13>=0.18",
]
# Pixal3D's TRELLIS.2 backbone: sparse convolution (FlexGEMM), mesh cleanup/remeshing (CuMesh) and the dual-grid
# mesher + GLB baker (o-voxel). All three are compiled CUDA extensions whose setup.py pins C++17, which torch's
# headers no longer accept: build them through run.sh (or with its CXX/NVCC_APPEND_FLAGS exports).
pixal3d = [
    "flex_gemm",
    "cumesh",
    "o_voxel",
    "nvdiffrast",  # o-voxel's texture baker
    "easydict>=1.13",
    "scipy>=1.14",  # MoGe's focal/shift solver
]

[tool.uv]
no-build-isolation-package = ["nvdiffrast", "flex_gemm", "cumesh", "o_voxel"]

[tool.uv.sources]
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast", tag = "v0.4.0" }
flex_gemm = { git = "https://github.com/JeffreyXiang/FlexGEMM", rev = "6dd94a859c26ee8246888502eada3dd8ad85532e" }
cumesh = { git = "https://github.com/JeffreyXiang/CuMesh", rev = "12289e1062f0603f2f0d0771b02e1395d247f26f" }
o_voxel = { git = "https://github.com/microsoft/TRELLIS.2", rev = "75fbf0183001ed9876c8dbb35de6b68552ee08bd", subdirectory = "o-voxel" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
